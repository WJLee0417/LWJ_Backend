<!doctype html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 | Step-up Backend</title>
</head>
<body>
    <main>
        <h1>로그인</h1>
        <p th:if="${param.registered}">회원가입이 완료되었습니다. 로그인해 주세요.</p>
        <p th:if="${param.error}">아이디 또는 비밀번호가 일치하지 않습니다.</p>
        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>아이디 <input type="text" name="id" autocomplete="username" required></label>
            <label>비밀번호 <input type="password" name="password" autocomplete="current-password" required></label>
            <button type="submit">로그인</button>
        </form>
        <a th:href="@{/join}">회원가입</a>
    </main>
</body>
</html>

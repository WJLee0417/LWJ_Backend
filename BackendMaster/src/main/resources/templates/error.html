<!doctype html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status + ' ' + title + ' - Step-up Backend'}">오류 | Step-up Backend</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container narrow">
    <p class="error" th:text="${status + ' ' + title}">오류</p>
    <h1>요청을 처리할 수 없습니다.</h1>
    <p th:text="${message}">잠시 후 다시 시도해 주세요.</p>
    <p class="text-link"><a th:href="@{/boards}">게시글 목록으로 이동</a></p>
    <p class="text-link"><a th:href="@{/}">홈으로 이동</a></p>
</main>
</body>
</html>

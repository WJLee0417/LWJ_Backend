<!doctype html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title>게시글 목록 | Step-up Backend</title>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>게시글 목록</h1>
            <form th:action="@{/logout}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">로그아웃</button>
            </form>
        </header>

        <nav class="actions">
            <a th:href="@{/boards(category='전체')}" class="button secondary">전체</a>
            <a th:href="@{/boards(category='공지')}" class="button secondary">공지</a>
            <a th:href="@{/boards(category='학습')}" class="button secondary">학습</a>
            <a th:href="@{/boards(category='자유')}" class="button secondary">자유</a>
            <a th:href="@{/boards/new}" class="button">새 글 작성</a>
        </nav>

        <form th:action="@{/boards}" method="get" class="search">
            <input type="hidden" name="category" th:value="${category}">
            <select name="searchType">
                <option value="title" th:selected="${searchType == 'title'}">제목</option>
                <option value="content" th:selected="${searchType == 'content'}">내용</option>
                <option value="author" th:selected="${searchType == 'author'}">작성자</option>
            </select>
            <input name="keyword" th:value="${keyword}" placeholder="검색어">
            <button type="submit">검색</button>
        </form>

        <table>
            <thead><tr><th>번호</th><th>분류</th><th>제목</th><th>작성자</th><th>조회수</th><th>등록일</th></tr></thead>
            <tbody>
                <tr th:each="notice : ${boardPage.notices}" class="notice">
                    <td>공지</td><td th:text="${notice.category}">공지</td>
                    <td><a th:href="@{/boards/{id}(id=${notice.id})}" th:text="${notice.title}">제목</a></td>
                    <td th:text="${notice.authorId}">-</td><td th:text="${notice.views}">0</td><td th:text="${notice.createdAt}">날짜</td>
                </tr>
                <tr th:each="board, status : ${boardPage.boards}">
                    <td th:text="${boardPage.totalElements - (boardPage.page * boardPage.size) - status.index}">1</td>
                    <td th:text="${board.category}">자유</td>
                    <td><a th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}">제목</a></td>
                    <td th:text="${board.authorId}">작성자</td><td th:text="${board.views}">0</td><td th:text="${board.createdAt}">날짜</td>
                </tr>
                <tr th:if="${#lists.isEmpty(boardPage.notices) and #lists.isEmpty(boardPage.boards)}">
                    <td colspan="6">등록된 게시글이 없습니다.</td>
                </tr>
            </tbody>
        </table>

        <nav class="pagination" th:if="${boardPage.totalPages > 1}">
            <a th:if="${boardPage.page > 0}" th:href="@{/boards(category=${category},searchType=${searchType},keyword=${keyword},page=${boardPage.page})}">이전</a>
            <span th:each="pageNumber : ${#numbers.sequence(1, boardPage.totalPages)}">
                <span th:if="${pageNumber == boardPage.page + 1}" class="current" th:text="${pageNumber}">1</span>
                <a th:if="${pageNumber != boardPage.page + 1}" th:href="@{/boards(category=${category},searchType=${searchType},keyword=${keyword},page=${pageNumber})}" th:text="${pageNumber}">1</a>
            </span>
            <a th:if="${boardPage.page + 1 < boardPage.totalPages}" th:href="@{/boards(category=${category},searchType=${searchType},keyword=${keyword},page=${boardPage.page + 2})}">다음</a>
        </nav>
    </main>
</body>
</html>

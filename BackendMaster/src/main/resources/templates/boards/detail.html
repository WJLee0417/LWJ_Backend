<!doctype html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title th:text="${board.title} + ' | Step-up Backend'">게시글 상세</title>
</head>
<body>
    <main class="container">
        <header class="header"><h1 th:text="${board.title}">제목</h1><a th:href="@{/boards}" class="button secondary">목록</a></header>
        <div class="meta"><span th:text="${board.category}">분류</span><span th:text="${board.authorId}">작성자</span><span th:text="|조회수 ${board.views}|">조회수</span><span th:text="${board.createdAt}">날짜</span></div>
        <div class="content" th:text="${board.content}">본문</div>

        <div class="actions" th:if="${board.authorId == currentUserId}">
            <a th:href="@{/boards/{id}/edit(id=${board.id})}" class="button">수정</a>
            <form th:action="@{/boards/{id}/delete(id=${board.id})}" method="post" class="inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="danger">삭제</button>
            </form>
        </div>

        <section>
            <h2>댓글</h2>
            <p th:if="${param.commentError}" class="error">댓글 내용을 확인해 주세요.</p>
            <article th:each="comment : ${comments}" class="comment">
                <strong th:text="${comment.authorId}">작성자</strong>
                <span th:text="${comment.createdAt}">날짜</span>
                <p th:text="${comment.content}">내용</p>
                <form th:if="${comment.authorId == currentUserId}" th:action="@{/comments/{id}/delete(id=${comment.id})}" method="post" class="inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="danger">댓글 삭제</button>
                </form>
            </article>
            <form th:action="@{/boards/{id}/comments(id=${board.id})}" th:object="${commentForm}" method="post" class="field">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label for="content">댓글</label>
                <input id="content" th:field="*{content}" placeholder="댓글을 입력하세요." required>
                <button type="submit">댓글 등록</button>
            </form>
        </section>
    </main>
</body>
</html>

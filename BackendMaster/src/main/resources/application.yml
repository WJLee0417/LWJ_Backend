spring:
  application:
    name: step-up-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  thymeleaf:
    cache: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  bootstrap:
    admin-initial-password: ${ADMIN_INITIAL_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.flywaydb: warn
